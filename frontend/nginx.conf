# Serve the built SPA. /graphql is routed to the BFF by Caddy (the outer reverse proxy),
# so this server only serves static files with SPA history fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The SPA shell must never be cached — otherwise browsers keep serving a stale
    # bundle after a deployment (hashed assets below stay cacheable forever).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
